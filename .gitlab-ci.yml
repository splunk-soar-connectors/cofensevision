# CI/CD pipeline for Cofense Vision Splunk SOAR Integration
# Stages: sonarqube, pre-commit, build

stages:
  - sonarqube
  - pre-commit
  - build

variables:
  PYTHON_VERSION: "3.13"

default:
  tags:
    - docker

# Cache pip dependencies between jobs
cache:
  paths:
    - .venv/
    - .cache/pip

sonarqube:
  stage: sonarqube
  tags:
    - docker
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - ls -al
    - sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=true -Dsonar.projectKey=CofenseVision-Splunk-SOAR
  allow_failure: true

pre-commit:
  stage: pre-commit
  image: python:${PYTHON_VERSION}
  variables:
    # package-app-dependencies needs Docker, which this image lacks, and requirements.txt is currently empty.
    SKIP: package-app-dependencies
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install pre-commit
  script:
    - pre-commit run --all-files
  after_script:
    - if [ -d ".venv" ]; then source .venv/bin/activate && deactivate; fi
  allow_failure: true

build:
  stage: build
  image: alpine:latest
  script:
    - apk add --no-cache bash tar
    - DIR_NAME=$(basename "$(pwd)")
    - echo $DIR_NAME
    - rm -rf build && mkdir build
    - echo "Building APP"
    - tar --exclude=".git*" --exclude=".venv" --exclude="wheels/.git*" --exclude="dependencies/.git*" --exclude="*.swp" --exclude="*.yml" --exclude="Makefile" --exclude="*.pyc" --exclude="exclude_files.txt" --exclude="__pycache__" --exclude="*/__pycache__" --exclude="tests" --exclude="*/tests" --exclude="build" -hzcvf "./build/cofensevision-splunk-soar-integration.tgz" .
    - echo "-------"
    - ls -la
    - echo "========="
    - ls -la build
  artifacts:
    paths:
      - build/*.tgz
    expire_in: 4 week
